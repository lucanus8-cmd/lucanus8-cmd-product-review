# 식약처 의약품안전나라의 공개 화면을 읽어 적는다. 손으로만 돌린다.
# 제품 검토 사이트와는 상관없다.
name: check-nedrug

on:
  workflow_dispatch:
    inputs:
      item_seq:
        description: "품목기준코드 (쉼표로 여러 개)"
        required: true
        default: "201310988,201310989"
      detail:
        description: "1 이면 특허 상세 화면까지 읽는다"
        required: false
        default: "0"
      what:
        description: "item = 품목 상세, dmf = DMF 목록 화면 찾기, fetch = DMF 목록 전부 받기, price = 심평원 약가 고시 엑셀 받아 보기"
        required: false
        default: "item"
      urls:
        description: "dmf 일 때 더 열어 볼 주소 (쉼표)"
        required: false
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.49.0-${{ runner.os }}

      - name: 브라우저 준비
        if: inputs.what != 'fetch'
        run: |
          python -m pip install --quiet playwright==1.49.0
          python -m playwright install --with-deps chromium

      - name: 품목 상세 읽기
        if: inputs.what == 'item' || inputs.what == ''
        env:
          ITEM_SEQ: ${{ inputs.item_seq }}
          DETAIL: ${{ inputs.detail }}
        run: python .github/scripts/check_nedrug.py

      - name: DMF 목록 화면 찾기
        if: inputs.what == 'dmf'
        env:
          URLS: ${{ inputs.urls }}
        run: python .github/scripts/check_nedrug_dmf.py

      - name: DMF 목록 전부 받아 보기 (저장은 안 함)
        if: inputs.what == 'fetch'
        env:
          OUT: out/dmf_list.csv
          META: out/dmf_meta.json
        run: |
          python -m pip install --quiet requests==2.32.3 lxml==5.3.0
          mkdir -p out
          python .github/scripts/fetch_dmf.py

      - name: 받은 파일 남기기
        if: always() && inputs.what == 'fetch'
        uses: actions/upload-artifact@v4
        with:
          name: dmf
          path: out/
          if-no-files-found: ignore
          retention-days: 3

      - name: 심평원 약가 고시 엑셀 받아 보기
        if: inputs.what == 'price'
        env:
          URLS: ${{ inputs.urls }}
          OUT_DIR: out
        run: |
          python -m pip install --quiet pandas openpyxl xlrd
          python .github/scripts/check_hira_price.py
