# 식약처 의약품안전나라의 공개 화면을 읽어 적는다. 손으로만 돌린다.
# 제품 검토 사이트와는 상관없다.
name: check-nedrug

on:
  workflow_dispatch:
    inputs:
      item_seq:
        description: "품목기준코드 (쉼표로 여러 개)"
        required: true
        default: "201310988,201310989"
      detail:
        description: "1 이면 특허 상세 화면까지 읽는다"
        required: false
        default: "0"
      what:
        description: "item = 품목 상세, dmf = DMF 목록 화면 찾기, fetch = DMF 목록 전부 받기, price = 심평원 약가 고시 엑셀 받아 보기, clinic = 개발코드 생동 찾기, healthkr = 약학정보원 질환정보 구조·약관 보기, ctgov = ClinicalTrials.gov 접속·간이 메타분석 (words 에 약:용량,약:용량), opentargets = Open Targets 구조·질의 시험 (words 에 약;질환), repurpose = 약물 재창출 모듈 시험 (words 에 약;질환), paper = 공개 논문 표 읽기 (words 에 PMC번호·DOI 쉼표), metaref = 메타분석 계산을 R metafor·논문 값과 비교, otcover = FDA 신약의 Open Targets 수록률, overseas = 미국·일본 허가와 국내 허가를 주성분·제형으로 맞출 수 있는지, jpnames = 일본 성분명 공식 영문 자료 찾기, uskr = 미국 FDA와 국내 허가를 FDA 성분 사전으로 맞추기, fdatables = FDA 성분 대조표·허가목록+적응증 만들기 (save=1 이면 data 가지 fda/ 에 저장), fdadaily = FDA 매일 갱신 자료 확인, fdasheet = FDA 국내 비교를 구글 시트에 쓰기"
        required: false
        default: "item"
      urls:
        description: "dmf 일 때 더 열어 볼 주소 (쉼표)"
        required: false
        default: ""
      words:
        description: "dmf 일 때 찾을 메뉴 글자 (쉼표, 비우면 DMF)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.49.0-${{ runner.os }}

      - name: 브라우저 준비
        if: inputs.what != 'fetch' && inputs.what != 'ctgov' && inputs.what != 'ctspeed' && inputs.what != 'pubmed' && inputs.what != 'metamod' && inputs.what != 'opentargets' && inputs.what != 'repurpose' && inputs.what != 'paper' && inputs.what != 'metaref' && inputs.what != 'otcover' && inputs.what != 'overseas' && inputs.what != 'jpnames' && inputs.what != 'uskr' && inputs.what != 'fdatables' && inputs.what != 'fdadaily' && inputs.what != 'fdasheet'
        run: |
          python -m pip install --quiet playwright==1.49.0
          python -m playwright install --with-deps chromium

      - name: 품목 상세 읽기
        if: inputs.what == 'item' || inputs.what == ''
        env:
          ITEM_SEQ: ${{ inputs.item_seq }}
          DETAIL: ${{ inputs.detail }}
        run: python .github/scripts/check_nedrug.py

      - name: DMF 목록 화면 찾기
        if: inputs.what == 'dmf'
        env:
          URLS: ${{ inputs.urls }}
          WORDS: ${{ inputs.words }}
        run: python .github/scripts/check_nedrug_dmf.py

      - name: DMF 목록 전부 받아 보기 (저장은 안 함)
        if: inputs.what == 'fetch'
        env:
          OUT: out/dmf_list.csv
          META: out/dmf_meta.json
        run: |
          python -m pip install --quiet requests==2.32.3 lxml==5.3.0
          mkdir -p out
          python .github/scripts/fetch_dmf.py

      - name: 받은 파일 남기기
        if: always() && inputs.what == 'fetch'
        uses: actions/upload-artifact@v4
        with:
          name: dmf
          path: out/
          if-no-files-found: ignore
          retention-days: 3

      - name: 심평원 약가 고시 엑셀 받아 보기
        if: inputs.what == 'price'
        env:
          URLS: ${{ inputs.urls }}
          OUT_DIR: out
        run: |
          python -m pip install --quiet pandas openpyxl xlrd
          python .github/scripts/check_hira_price.py

      - name: 임상시험 승인 목록에서 개발코드 시험 찾기
        if: inputs.what == 'clinic'
        env:
          STEP: 생동
          MONTHS: "24"
          FOCUS: ${{ inputs.words }}
          DETAIL: ${{ inputs.detail }}
        run: python .github/scripts/check_nedrug_clinic.py

      - name: 약학정보원 질환정보 구조·약관 보기
        if: inputs.what == 'healthkr'
        env:
          URLS: ${{ inputs.urls }}
        run: |
          python -m pip install --quiet requests==2.32.3
          python .github/scripts/check_healthkr.py

      - name: ClinicalTrials.gov 접속 시험 · 간이 메타분석
        if: inputs.what == 'ctgov'
        env:
          DRUGS: ${{ inputs.words }}
          OPTS: ${{ inputs.urls }}
        run: |
          python -m pip install --quiet requests==2.32.3
          python .github/scripts/check_ctgov.py

      - name: ClinicalTrials.gov 받는 방법별 크기·시간 비교
        if: inputs.what == 'ctspeed'
        env:
          DRUGS: ${{ inputs.words }}
        run: |
          python -m pip install --quiet requests==2.32.3
          python .github/scripts/check_ctgov_speed.py

      - name: PubMed 접속 시험 (학술지·임상번호로 논문 찾기)
        if: inputs.what == 'pubmed'
        env:
          DRUGS: ${{ inputs.words }}
          NCTS: ${{ inputs.urls }}
        run: |
          python -m pip install --quiet requests==2.32.3
          python .github/scripts/check_pubmed.py

      - name: 사이트용 메타분석 모듈을 실제 자료로 돌려 보기
        if: inputs.what == 'metamod'
        env:
          CASE: ${{ inputs.words }}
        run: python .github/scripts/check_meta_module.py

      - name: Open Targets 공개 API 구조·질의 시험
        if: inputs.what == 'opentargets'
        env:
          WORDS: ${{ inputs.words }}
        run: python .github/scripts/check_opentargets.py

      - name: 사이트용 약물 재창출 모듈을 실제 자료로 돌려 보기
        if: inputs.what == 'repurpose'
        env:
          WORDS: ${{ inputs.words }}
        run: python .github/scripts/check_repurpose.py

      - name: 공개 논문의 표·그림 설명 읽기 (메타분석 검산용)
        if: inputs.what == 'paper'
        env:
          PAPERS: ${{ inputs.words }}
        run: python .github/scripts/check_paper_tables.py

      - name: 사이트 메타분석 계산을 R metafor·논문 값과 비교
        if: inputs.what == 'metaref'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq r-base-core r-cran-metafor > /dev/null
          Rscript .github/scripts/metaref.R
          python .github/scripts/check_meta_ref.py

      - name: FDA 신약이 Open Targets 에 얼마나 있는지 세기
        if: inputs.what == 'otcover'
        run: python .github/scripts/check_ot_coverage.py

      - name: 미국·일본 허가를 국내 허가와 주성분·제형으로 맞춰 보기
        if: inputs.what == 'overseas'
        run: |
          python -m pip install --quiet pandas openpyxl xlrd pypdf
          python .github/scripts/check_overseas.py

      - name: 일본 성분명 공식 영문 자료 찾기
        if: inputs.what == 'jpnames'
        run: python .github/scripts/check_jpnames.py

      - name: 미국 FDA 허가와 국내 허가를 FDA 성분 사전으로 맞추기
        if: inputs.what == 'uskr'
        run: |
          python -m pip install --quiet pandas ijson
          python .github/scripts/check_us_kr.py

      - name: FDA 표 만들기 → 국내 비교 → 구글 시트 '제품검토 · FDA 비교' 에 쓰기
        if: inputs.what == 'fdasheet'
        env:
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          python -m pip install --quiet pandas ijson openpyxl google-auth google-api-python-client
          OUT_DIR=out/fda PREV_DIR=none python .github/scripts/build_fda_tables.py
          USKR_OUT=out/uskr python .github/scripts/check_us_kr.py
          OUT_DIR=out/fda USKR_OUT=out/uskr python .github/scripts/write_fda_sheet.py

      - name: FDA 매일 갱신 자료 확인 (Drugs@FDA 파일·DailyMed)
        if: inputs.what == 'fdadaily'
        run: python .github/scripts/check_fda_daily.py

      - name: FDA 성분 대조표·허가목록+적응증 만들기
        if: inputs.what == 'fdatables'
        run: |
          python -m pip install --quiet pandas ijson openpyxl
          mkdir -p prev
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            git worktree add databr FETCH_HEAD
            if [ -d databr/fda ]; then cp -r databr/fda prev/fda; fi
          fi
          OUT_DIR=out/fda PREV_DIR=prev/fda python .github/scripts/build_fda_tables.py

      - name: FDA 표 남기기 (Actions 화면에서 내려받기)
        if: always() && inputs.what == 'fdatables'
        uses: actions/upload-artifact@v4
        with:
          name: fda-tables
          path: out/fda/
          if-no-files-found: ignore
          retention-days: 14

      - name: FDA 표를 data 가지 fda/ 에 저장 (사이트 main 가지는 건드리지 않음)
        if: inputs.what == 'fdatables' && inputs.detail == '1'
        run: |
          git config user.name "fda-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd databr
          git checkout -B data
          mkdir -p fda
          cp ../out/fda/* fda/
          git add fda
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git commit -qm "FDA 표 $(date -u -d '+9 hours' +%Y-%m-%d)"
          git push -q origin data
          echo "저장함"
