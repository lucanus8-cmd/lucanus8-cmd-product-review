# 매일 아침 FDA 허가 자료를 국내 허가·식약처 임상과 비교해 구글 시트 '제품검토 · FDA 비교'에 쓰고,
# 사이트 'FDA 비교' 화면용 작은 파일을 'data' 가지 fda_site/ 에 저장한다.
# 사이트 코드가 있는 main 가지는 건드리지 않는다 — 그래서 사이트가 다시 배포되지 않는다. 매출 자료는 읽지 않는다.
name: fda-daily

on:
  schedule:
    - cron: "7 21 * * *"   # 매일 한국시간 06:07 (UTC 21:07). 허가·임상 시트 갱신(05:00~)이 끝난 뒤 읽는다.
  workflow_dispatch:
    inputs:
      save:
        description: "1 이면 data 가지에 저장한다"
        required: false
        default: "1"

permissions:
  contents: write
  actions: write

concurrency:
  group: fda-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: FDA 비교 만들기 → 구글 시트 → 사이트용 파일
        env:
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          SAVE: ${{ github.event_name == 'schedule' && '1' || inputs.save }}
        run: bash .github/scripts/fda_daily.sh

      # 공개 저장소는 60일 동안 활동이 없으면 예약이 멈출 수 있다 — 돌 때마다 다시 켠다
      - name: 예약 계속 켜 두기
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X PUT -o /dev/null -w "예약 다시 켜기: HTTP %{http_code}\n" \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/fda-daily.yml/enable"
