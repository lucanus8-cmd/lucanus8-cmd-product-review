# 사이트가 잠들지 않게 유지합니다.
# Streamlit 무료 플랜은 한동안 접속이 없으면 앱을 재우고, 다시 깨울 때 1~3분이 걸립니다.
# 주소만 호출하는 '핑'은 앱 본체를 켜지 못하므로, 실제 브라우저로 접속해 화면을 띄웁니다.
#
# ■ 2026-11 현재 자동 실행을 꺼 둔 상태입니다 ■
#   앱이 '초대받은 계정만' 공개라, 자동 접속(로봇)은 구글 로그인을 할 수 없어
#   깨울 수가 없습니다. 돌아봐야 할 일이 없으므로 schedule 을 주석 처리했습니다.
#
#   다시 켜려면: 앱을 공개(Settings > Sharing > public)로 바꾼 뒤,
#   아래 schedule 두 줄의 '# ' 를 지우고 저장하면 됩니다.
#   (지금도 Actions 탭에서 'Run workflow' 로 수동 실행은 가능합니다)
name: keep-alive

on:
  # schedule:
  #   - cron: "17 */4 * * *"   # 4시간마다 (UTC 00:17, 04:17, 08:17 …)
  workflow_dispatch:            # Actions 탭에서 수동 실행

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 브라우저 내려받기는 느리다 → 한 번 받아두고 재사용
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.49.0-${{ runner.os }}

      - name: 브라우저 준비
        run: |
          python -m pip install --quiet playwright==1.49.0
          python -m playwright install --with-deps chromium

      - name: 사이트 접속
        env:
          APP_URL: ${{ vars.APP_URL || 'https://xbpft.streamlit.app/' }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: python .github/scripts/keepalive.py

      # 실패했을 때 그 순간의 화면을 남긴다 (Actions 실행 화면 하단 Artifacts 에서 받기)
      - name: 실패 화면 남기기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keepalive-diag
          path: diag/
          retention-days: 7
          if-no-files-found: ignore
