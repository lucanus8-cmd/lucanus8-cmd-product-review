# 배포된 사이트의 특허 화면에서 성분 하나를 검색해 나온 표를 그대로 적는다.
# 손으로만 돌린다(일정 실행 없음). 읽기만 하므로 사이트는 바뀌지 않는다.
name: check-patent

on:
  workflow_dispatch:
    inputs:
      query:
        description: "찾을 성분명 또는 품목명"
        required: true
        default: "미라베그론"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.49.0-${{ runner.os }}

      - name: 브라우저 준비
        run: |
          python -m pip install --quiet playwright==1.49.0
          python -m playwright install --with-deps chromium

      - name: 특허 화면에서 찾기
        env:
          APP_URL: ${{ vars.APP_URL || 'https://appuct-review-mwt63vloynbyw3uv2xbpft.streamlit.app/' }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          QUERY: ${{ inputs.query }}
        run: python .github/scripts/check_patent.py
